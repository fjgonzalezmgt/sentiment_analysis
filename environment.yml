name: sentiment-analysis
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=26,<27
  - pip:
      - beautifulsoup4>=4.15,<5
      - chromadb>=1.5.9,<2
      - lxml>=6,<7
      - openai>=2.48,<3
      - openpyxl>=3.1,<4
      - pandas>=2.3,<3
      - playwright>=1.61,<2
      - plotly>=6.0,<7
      - pydantic>=2.13,<3
      - python-dotenv>=1.2,<2
      - requests>=2.34,<3
      - streamlit>=1.50,<2
      - pytest>=9.1,<10
      - ruff>=0.16,<1
variables:
  OPENAI_CLASSIFICATION_MODEL: gpt-5.6-luna
  OPENAI_REASONING_EFFORT: none
  OPENAI_MAX_OUTPUT_TOKENS: "256"
  OPENAI_MAX_RETRIES: "5"
  OPENAI_TIMEOUT_SECONDS: "60"
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  CHROMA_PATH: chroma_data
  CHROMA_COLLECTION: customer_reviews
  CHROMA_UPSERT_BATCH_SIZE: "100"
